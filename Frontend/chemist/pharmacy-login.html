<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Login</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pharmacy-login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="page">

    <!-- =========================
            LOGO
    ========================== -->

    <div class="logo-section">

        <div class="logo-wrapper">

            <img src="../assets/logo.png" class="logo">

        </div>

        <h2>MK Animal Health</h2>

        <p>Pharmacy Portal</p>

    </div>


    <!-- =========================
          LOGIN CARD
    ========================== -->

    <div class="login-card">

        <h1>Pharmacy Login</h1>

        <p>Enter your credentials to continue</p>


        <!-- User ID -->

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                id="adminId"
                placeholder="User ID">

        </div>


        <!-- Password -->

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="adminPassword"
                placeholder="Password">

            <i
                class="fa-solid fa-eye"
                id="togglePassword">
            </i>

        </div>


        <!-- Remember -->

        <div class="remember">

            <label>

                <input type="checkbox">

                Remember Me

            </label>

        </div>


        <!-- Login -->

        <button
            id="loginBtn"
            type="button">

            LOGIN

        </button>


        <!-- Back -->

        <a href="../login.html" class="back">

            ← Back to Role Selection

        </a>

    </div>

</div>

<script src="../js/pharmacy-login.js"></script>

</body>

</html>
